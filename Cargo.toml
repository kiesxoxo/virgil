[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
virgil-core = { path = "crates/core" }
virgil-engine-mpd = { path = "crates/engine-mpd" }
virgil-homekit = { path = "crates/homekit" }
virgil-library = { path = "crates/library" }
virgil-radio = { path = "crates/radio" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mime_guess = "2"
num-bigint = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "json", "query"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process", "signal"] }
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "11"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
