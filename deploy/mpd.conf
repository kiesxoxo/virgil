# /etc/mpd.conf — MPD as Virgil's playback engine only (virgild is the UI and library).

music_directory      "/mnt/music"
playlist_directory   "/var/lib/mpd/playlists"
db_file              "/var/lib/mpd/tag_cache"
state_file           "/var/lib/mpd/state"
sticker_file         "/var/lib/mpd/sticker.sql"

# Debian's mpd.socket provides /run/mpd/socket (and port 6600) and these lines
# are ignored. They apply when MPD runs without socket activation.
bind_to_address      "/run/mpd/socket"
bind_to_address      "127.0.0.1"
port                 "6600"

# Rescan on file changes (inotify; not on network mounts — use Rescan in Settings).
auto_update          "yes"
restore_paused       "yes"

# Nothing may touch the samples.
replaygain           "off"
volume_normalization "no"

# virgild walks the database one directory per request; leave room for big folders.
max_output_buffer_size "65536"

# Only used when a file exceeds what the Digi2 Pro takes (>192 kHz). The signal
# path in the UI shows "Resampled" when that happens.
resampler {
    plugin  "soxr"
    quality "very high"
}

audio_output {
    type            "alsa"
    name            "HiFiBerry Digi2 Pro"
    # hw: talks to the card directly: no dmix, no plug, no conversion.
    device          "hw:CARD=sndrpihifiberry,DEV=0"
    # No volume control in software: set volume on the DAC or amp.
    mixer_type      "none"
    auto_resample   "no"
    auto_channels   "no"
    auto_format     "no"
    # DSD64 as DoP over S/PDIF (176.4 kHz carrier). The DAC must accept DoP.
    dop             "yes"
}
