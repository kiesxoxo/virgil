# /etc/virgil/virgild.toml

# Port 80 is allowed by the systemd unit (CAP_NET_BIND_SERVICE): http://virgil.local/
listen = "0.0.0.0:80"

# The Unix socket also lets virgild queue files outside MPD's database.
mpd = "/run/mpd/socket"

# Library database and artwork cache (systemd's StateDirectory).
data_dir = "/var/lib/virgil"

# HiFiBerry Digi2 Pro; see `cat /proc/asound/cards`.
alsa_card = "sndrpihifiberry"

# AirPlay (shairport-sync) shares the DAC. Its session hooks call
# `virgild ctl acquire|release airplay`; when you press play in the web UI
# during an AirPlay session, virgild runs `preempt` to end that session.
[sources.airplay]
preempt = "dbus-send --system --type=method_call --dest=org.gnome.ShairportSync /org/gnome/ShairportSync org.gnome.ShairportSync.DropSession"

# Apple Home: a switch that is on while Virgil plays, so "Hey Siri, turn off
# Virgil" stops it. Advertised through avahi-daemon; add it from Settings ›
# Apple Home in the web UI. Remove this section to turn it off.
[homekit]
name = "Virgil"
port = 51827

# Downloads: find albums the library doesn't have and have Lidarr get them. Lidarr's root folder
# must be the folder MPD plays (Virgil rescans it once something is in). Uncomment to turn it on.
# [lidarr]
# url = "http://nas:8686"
# api_key = "…"            # Lidarr › Settings › General › API Key
# root = "/data/Music"     # only if Lidarr has more than one root folder

# Single songs too: slskdpp gets the file from Soulseek and Lidarr files it into its album.
# [slskdpp]
# url = "http://nas:5030"
# api_key = "…"            # slskdpp › Settings › API keys
# downloads = "/data/Downloads/slskdpp"   # slskdpp's downloads folder, as Lidarr sees it
# formats = ["flac"]       # file types to take, best first
