// /etc/shairport-sync.conf — AirPlay 2 receiver sharing the DAC with hifid.
// Full option reference: https://github.com/mikebrady/shairport-sync/blob/master/scripts/shairport-sync.conf

general = {
	// The name shown in AirPlay pickers; %H is the hostname. Use one name per room.
	name = "%H";
	output_backend = "alsa";
	mdns_backend = "avahi";
	// AirPlay keeps rooms in sync by adjusting samples: synchronized, not bit-perfect.
	interpolation = "auto";
	// The D-Bus interface lets hifid end a session when you press play in the web UI.
	dbus_service_bus = "system";
};

sessioncontrol = {
	// hifid stops MPD and waits until ALSA reports the DAC closed before AirPlay opens it.
	run_this_before_play_begins = "/usr/local/bin/hifid --config /etc/hifi/hifid.toml ctl acquire airplay";
	run_this_after_play_ends = "/usr/local/bin/hifid --config /etc/hifi/hifid.toml ctl release airplay";
	wait_for_completion = "yes";
	allow_session_interruption = "yes";
};

alsa = {
	output_device = "hw:CARD=sndrpihifiberry,DEV=0";
	// The Digi2 Pro has no hardware mixer, so the AirPlay volume slider attenuates
	// in software. Set `ignore_volume_control = "yes";` in `general` for full level.
	// Release the device when idle so MPD can open it.
	disable_standby_mode = "never";
};
