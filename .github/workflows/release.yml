name: release

# A release tag builds nothing: the ci run for the same commit on main has
# already tested it, pushed the multi-arch image as sha-<short> and built
# Virgil.exe. This waits for that run, gives the image its version tag and
# attaches the run's Virgil.exe to the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The commit and the tag are usually pushed together, so the ci run may
      # still be starting, or running.
      - name: Wait for ci on main
        id: ci
        run: |
          for _ in $(seq 30); do
            run=$(gh run list --workflow ci --branch main --event push --commit "$GITHUB_SHA" \
              --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::No ci run on main for $GITHUB_SHA; push the commit to main first"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          gh run watch "$run" --exit-status --interval 30 > /dev/null

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image
        run: |
          docker buildx imagetools create -t "$IMAGE:${GITHUB_REF_NAME#v}" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

      - name: Attach Virgil.exe
        run: |
          gh run download "${{ steps.ci.outputs.run }}" -n virgil-windows -D dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/Virgil.exe --clobber
