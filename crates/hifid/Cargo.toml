[package]
name = "hifid"
description = "hifi daemon: web UI, API and DAC arbitration in front of MPD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
hifi-core.workspace = true
hifi-engine-mpd.workspace = true
hifi-library.workspace = true
hifi-tags.workspace = true
mime_guess.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
# The desktop app window: WebView2 in a native window.
tao = "0.37"
wry = "0.57"
image.workspace = true

[features]
# Embed mpd.exe into hifi.exe (desktop mode); HIFI_MPD_EXE names the file at build time.
bundled-mpd = []
