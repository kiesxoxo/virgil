// shairport-sync.conf for the Docker setup (mounted by compose.yaml).
// Full option reference: https://github.com/mikebrady/shairport-sync/blob/master/scripts/shairport-sync.conf

general = {
	// The name shown in AirPlay pickers; %H is the Pi's hostname. Use one name per room.
	name = "%H";
	output_backend = "alsa";
	mdns_backend = "avahi";
	// AirPlay keeps rooms in sync by adjusting samples: synchronized, not bit-perfect.
	interpolation = "auto";
	// hifi ends AirPlay sessions over this interface when you press play in the web UI.
	dbus_service_bus = "system";
};

sessioncontrol = {
	// Ask hifi for the DAC before playing (it stops MPD and waits for the device to close),
	// and give it back afterwards. Change the port if you changed HIFI_PORT.
	run_this_before_play_begins = "/usr/bin/curl -fsS -m 10 -X POST http://127.0.0.1:80/api/sources/airplay/acquire";
	run_this_after_play_ends = "/usr/bin/curl -fsS -m 10 -X POST http://127.0.0.1:80/api/sources/airplay/release";
	wait_for_completion = "yes";
	allow_session_interruption = "yes";
};

alsa = {
	// Must match ALSA_CARD in compose.yaml.
	output_device = "hw:CARD=sndrpihifiberry,DEV=0";
	// Release the DAC when idle so MPD can open it.
	disable_standby_mode = "never";
};
