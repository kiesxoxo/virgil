# Virgil on a Raspberry Pi — see the "Docker" section of README.md.
#
#   docker compose up -d
#
# Before the first start:
#   1. set the music path below (left side of `/music`)
#   2. install shairport-sync-dbus.conf on the host (lets Virgil end AirPlay sessions)
name: virgil

services:
  virgil:
    image: ghcr.io/kiesxoxo/virgil:latest
    network_mode: host
    restart: unless-stopped
    # Sound devices, including USB DACs plugged in later: /dev/snd is mounted
    # rather than listed under `devices`, and ALSA's device numbers (major
    # 116) are allowed. Settings offers new cards after a restart of Virgil.
    device_cgroup_rules:
      - "c 116:* rmw"
    environment:
      VIRGIL_PORT: "80"            # web UI: http://<pi>.local/
      ALSA_CARD: sndrpihifiberry # your DAC, from `cat /proc/asound/cards`
      MPD_DOP: "yes"             # DSD64 as DoP; set "no" if your DAC lacks DoP
      AIRPLAY: "on"
      HOMEKIT: "on"              # Apple Home switch for Siri ("turn off Virgil")
      # Downloads (optional): albums through Lidarr; with slskdpp, single songs from Soulseek.
      # LIDARR_URL: http://nas:8686
      # LIDARR_API_KEY: ...                         # Lidarr › Settings › General › API Key
      # SLSKDPP_URL: http://nas:5030
      # SLSKDPP_API_KEY: ...                        # slskdpp › Settings › API keys
      # SLSKDPP_DOWNLOADS: /data/Downloads/slskdpp  # slskdpp's downloads folder, as Lidarr sees it
      # SLSKDPP_FORMATS: flac                       # file types to take, best first: "flac,mp3"
    volumes:
      # Your music library. rslave: a NAS share mounted here after the
      # container starts (e.g. from /etc/fstab) still shows up inside.
      - type: bind
        source: /mnt/music
        target: /music
        read_only: true # Virgil only reads the music; Lidarr (or another tool) manages it
        bind:
          propagation: rslave
      - /dev/snd:/dev/snd            # sound devices (see device_cgroup_rules)
      - virgil-data:/data              # library database, artwork, MPD state
      - /proc/asound:/host/asound:ro # for the bit-perfect check (Docker hides /proc/asound)
      - /run/dbus:/run/dbus          # to end AirPlay sessions; to appear in Apple Home (avahi)

  shairport-sync:
    image: mikebrady/shairport-sync:latest
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd
    environment:
      ENABLE_AVAHI: "0" # use the Pi's own avahi-daemon and D-Bus
    volumes:
      - ./shairport-sync.conf:/etc/shairport-sync.conf:ro
      - /run/dbus:/run/dbus
      - /run/avahi-daemon:/run/avahi-daemon
    logging:
      options:
        max-size: "200k"
        max-file: "5"

volumes:
  virgil-data:
