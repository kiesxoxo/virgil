# hifi on a Raspberry Pi — see the "Docker" section of README.md.
#
#   docker compose up -d
#
# Before the first start:
#   1. set the music path below (left side of `/music`)
#   2. install shairport-sync-dbus.conf on the host (lets hifi end AirPlay sessions)
name: hifi

services:
  hifi:
    image: ghcr.io/mpkonmbk/hifi:latest
    network_mode: host
    restart: unless-stopped
    # Sound devices, including USB DACs plugged in later: /dev/snd is mounted
    # rather than listed under `devices`, and ALSA's device numbers (major
    # 116) are allowed. Settings offers new cards after a restart of hifi.
    device_cgroup_rules:
      - "c 116:* rmw"
    environment:
      HIFI_PORT: "80"            # web UI: http://<pi>.local/
      ALSA_CARD: sndrpihifiberry # your DAC, from `cat /proc/asound/cards`
      MPD_DOP: "yes"             # DSD64 as DoP; set "no" if your DAC lacks DoP
      AIRPLAY: "on"
    volumes:
      # Your music library. rslave: a NAS share mounted here after the
      # container starts (e.g. from /etc/fstab) still shows up inside.
      - type: bind
        source: /mnt/music
        target: /music
        read_only: false # hifi saves downloaded covers (cover.jpg) into album folders
        bind:
          propagation: rslave
      - /dev/snd:/dev/snd            # sound devices (see device_cgroup_rules)
      - hifi-data:/data              # library database, artwork, MPD state
      - /proc/asound:/host/asound:ro # for the bit-perfect check (Docker hides /proc/asound)
      - /run/dbus:/run/dbus          # to end an AirPlay session when you press play

  shairport-sync:
    image: mikebrady/shairport-sync:latest
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd
    environment:
      ENABLE_AVAHI: "0" # use the Pi's own avahi-daemon and D-Bus
    volumes:
      - ./shairport-sync.conf:/etc/shairport-sync.conf:ro
      - /run/dbus:/run/dbus
      - /run/avahi-daemon:/run/avahi-daemon
    logging:
      options:
        max-size: "200k"
        max-file: "5"

volumes:
  hifi-data:
